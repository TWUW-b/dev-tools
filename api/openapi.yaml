openapi: 3.0.3
info:
  title: '@twuw-b/dev-tools API'
  version: 1.0.0
  description: |
    @twuw-b/dev-tools バックエンド API

    ## デプロイ形態

    | デプロイ | パス | 用途 | 認証 |
    |---------|------|------|------|
    | Debug Notes API | `/__debug/api` | ノート・テスト・フィードバック全機能 | `X-Admin-Key` または Firebase IDトークン(Bearer)（Notes 全操作・Feedback 管理操作。OR受理・v1.2.16+） |
    | Feedback API | `/__manual/api` | フィードバック機能のみ | `X-Admin-Key`（管理操作） |

    ## 共通仕様

    - レスポンス: `application/json; charset=utf-8`（エクスポート・添付配信を除く）
    - CORS: `config.php` の `allowed_origins` に基づく
    - リクエストサイズ上限: 1MB
    - DB: SQLite（`Database.php` が自動マイグレーション）

    ## DB

    SQLite。Database.php が自動マイグレーション（スキーマバージョン: 13）。

    ### テーブル一覧

    | テーブル | 用途 | バージョン |
    |---------|------|----------|
    | meta | スキーマバージョン管理・公開トークン | v1 |
    | notes | デバッグノート | v1（v2-v6 で拡張） |
    | test_cases | テストケース定義 | v3（v11-v12 で拡張） |
    | test_runs | テスト実行結果 | v3 |
    | note_test_cases | ノート↔テストケース紐付け | v6 |
    | feedbacks | フィードバック | v7 |
    | rate_limits | IP レート制限 | v7 |
    | note_attachments | ノート添付ファイル | v8 |
    | feedback_attachments | フィードバック添付ファイル | v9 |
    | note_activities | ノートコメント・履歴 | v10 |
    | release_notes | リリースノート（号） | v13 |
    | release_note_items | リリースノートの項目 | v13 |
    | release_note_images | リリースノートの画像・動画 | v13 |

    ### config.php

    #### Debug Notes API 用

    ```php
    <?php
    return [
        'db' => [
            'dev'  => __DIR__ . '/data/debug-dev.sqlite',
            'test' => __DIR__ . '/data/debug-test.sqlite',
        ],
        'allowed_origins' => [
            'https://your-domain.com',
            'http://localhost:5173',
        ],
        'api_key' => null,
        'feedback_admin_key' => 'your-admin-key',
        'upload_dir' => __DIR__ . '/data/attachments',
    ];
    ```

    #### Feedback API 用

    ```php
    <?php
    return [
        'db' => __DIR__ . '/data/feedback.sqlite',
        'allowed_origins' => [
            'https://your-domain.com',
            'http://localhost:5173',
        ],
        'admin_key' => 'your-admin-key',
    ];
    ```

    > `db` の型が異なる: Debug Notes は環境別の連想配列、Feedback は単一パスの文字列。

servers: []

tags:
  - name: Notes
    description: デバッグノート
  - name: Activities
    description: ノートコメント・履歴
  - name: Note Attachments
    description: ノート添付ファイル
  - name: Test Cases
    description: テストケース
  - name: Test Runs
    description: テスト実行
  - name: Feedbacks
    description: フィードバック
  - name: Feedback Attachments
    description: フィードバック添付ファイル
  - name: Export
    description: エクスポート
  - name: ReleaseNotes
    description: リリースノート（直したことを利用者・クライアントに知らせる面）
  - name: OpenAPI
    description: API 仕様書

paths:
  /notes:
    get:
      tags: [Notes]
      summary: ノート一覧取得
      parameters:
        - $ref: '#/components/parameters/env'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved, rejected, fixed]
        - name: q
          in: query
          description: title / content の全文検索
          schema:
            type: string
        - name: includeDeleted
          in: query
          description: 削除済みを含む
          schema:
            type: string
            enum: ['0', '1']
            default: '0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
    post:
      tags: [Notes]
      summary: ノート作成
      parameters:
        - $ref: '#/components/parameters/env'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  note:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      status:
                        type: string
                      created_at:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /notes/{id}:
    get:
      tags: [Notes]
      summary: ノート詳細取得
      description: 添付ファイルとアクティビティを含む。
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/noteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  note:
                    $ref: '#/components/schemas/NoteDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Notes]
      summary: ノート論理削除
      description: deleted_at を設定する論理削除。
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/noteId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /notes/{id}/status:
    patch:
      tags: [Notes]
      summary: ステータス更新
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/noteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, in_progress, resolved, rejected, fixed]
                comment:
                  type: string
                  maxLength: 2000
                author:
                  type: string
                  maxLength: 100
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /notes/{id}/severity:
    patch:
      tags: [Notes]
      summary: 重要度更新
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/noteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity:
                  type: string
                  nullable: true
                  enum: [critical, high, medium, low, null]
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /notes/{id}/activities:
    get:
      tags: [Activities]
      summary: アクティビティ一覧
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/noteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  activities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Activities]
      summary: コメント追加
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/noteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 2000
                  minLength: 1
                author:
                  type: string
                  maxLength: 100
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  activity:
                    $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'

  /notes/{id}/attachments:
    post:
      tags: [Note Attachments]
      summary: 画像アップロード
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/noteId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    最大 5MB。許可 MIME: image/png, image/jpeg, image/webp, image/gif。
                    1ノートあたり最大 5 ファイル。
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  attachment:
                    $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Note Attachments]
      summary: 添付一覧
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/noteId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'

  /notes/{id}/attachments/{attachmentId}:
    delete:
      tags: [Note Attachments]
      summary: 添付削除
      description: ファイルも物理削除される。
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/noteId'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /attachments/{filename}:
    get:
      tags: [Note Attachments]
      summary: 添付ファイルのバイナリ配信
      description: JSON ではなく画像バイナリを返す。パストラバーサル検出時は 400 エラー。
      parameters:
        - $ref: '#/components/parameters/env'
        - name: filename
          in: path
          required: true
          description: ランダム hex 32 文字 + 拡張子
          schema:
            type: string
            pattern: '^[a-f0-9]+\.\w+$'
      responses:
        '200':
          description: 画像バイナリ
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=86400'
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'

  /test-cases:
    get:
      tags: [Test Cases]
      summary: テストケース一覧
      parameters:
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TestCase'
    delete:
      tags: [Test Cases]
      summary: テストケース一括削除
      description: 関連する test_runs、note_test_cases も連動削除。最大 100 件/リクエスト。
      parameters:
        - $ref: '#/components/parameters/env'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  maxItems: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  deleted:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /test-cases/import:
    post:
      tags: [Test Cases]
      summary: テストケース一括インポート
      description: 重複は無視（INSERT OR IGNORE）。最大 1,000 件/リクエスト。
      parameters:
        - $ref: '#/components/parameters/env'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cases]
              properties:
                cases:
                  type: array
                  items:
                    type: object
                    required: [domain, capability, title]
                    properties:
                      domain:
                        type: string
                        maxLength: 200
                      capability:
                        type: string
                        maxLength: 200
                      title:
                        type: string
                        maxLength: 500
                  maxItems: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /test-cases/tree:
    get:
      tags: [Test Cases]
      summary: テストツリー取得
      description: |
        domain → capability → cases の階層構造で、テスト結果と未解決ノート数を集計。

        capability.status の決定ロジック:
        | 条件 | status |
        |------|--------|
        | fail あり + open ノートあり | `fail` |
        | fail あり + open ノートなし | `retest` |
        | 全 pass（1件以上） | `passed` |
        | テスト未実行 | `null` |
      parameters:
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TestTree'

  /test-runs:
    post:
      tags: [Test Runs]
      summary: テスト結果を一括送信
      description: |
        同じ caseId が複数回ある場合、fail が優先（重複排除）。
        fail 時に個別ノート（runs[].note）または共通ノート（failNote）を作成可能。
        failNote は runs[].note 未指定の fail ケースに適用。
      parameters:
        - $ref: '#/components/parameters/env'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestRunRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        caseId:
                          type: integer
                        runId:
                          type: integer
                        result:
                          type: string
                          enum: [pass, fail, skip]
                        noteId:
                          type: integer
                          description: fail 時にノートが作成された場合
                  capability:
                    $ref: '#/components/schemas/CapabilityResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /feedbacks:
    post:
      tags: [Feedbacks]
      summary: フィードバック送信
      description: |
        認証不要（公開エンドポイント）。
        レート制限: 10 req / 60 sec / IP。
      parameters:
        - $ref: '#/components/parameters/env'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Feedbacks]
      summary: フィードバック一覧（管理者）
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/env'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, closed]
        - name: kind
          in: query
          schema:
            type: string
            enum: [bug, question, request, share, other]
        - name: target
          in: query
          schema:
            type: string
            enum: [app, manual]
        - name: custom_tag
          in: query
          description: 完全一致
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Feedback'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  customTags:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /feedbacks/{id}:
    get:
      tags: [Feedbacks]
      summary: フィードバック詳細（管理者）
      description: 添付・ログを含む。
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/feedbackId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/FeedbackDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Feedbacks]
      summary: フィードバック削除（管理者）
      description: 関連する添付ファイルも削除。
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/feedbackId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /feedbacks/{id}/status:
    patch:
      tags: [Feedbacks]
      summary: フィードバックステータス更新（管理者）
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/feedbackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, in_progress, closed]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                      updatedAt:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /feedbacks/{id}/attachments:
    post:
      tags: [Feedback Attachments]
      summary: フィードバック画像アップロード
      description: |
        認証不要。レート制限あり。
        1フィードバックあたり最大 3 ファイル。
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/feedbackId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    最大 5MB。許可 MIME: image/png, image/jpeg, image/webp, image/gif。
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  attachment:
                    $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Feedback Attachments]
      summary: フィードバック添付一覧（管理者）
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/feedbackId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /feedbacks/{id}/attachments/{attachmentId}:
    delete:
      tags: [Feedback Attachments]
      summary: フィードバック添付削除（管理者）
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/env'
        - $ref: '#/components/parameters/feedbackId'
        - $ref: '#/components/parameters/attachmentId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /feedbacks/export/{format}:
    get:
      tags: [Export]
      summary: フィードバックエクスポート（管理者）
      description: |
        ファイル名: feedbacks-YYYYMMDD.{ext}

        CSV カラム: ID, 種別, 対象, タグ, メッセージ, ステータス, ページURL, ユーザー種別, バージョン, 添付数, 作成日時, 更新日時
      security:
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/env'
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [json, csv, sqlite]
      responses:
        '200':
          description: |
            | format | Content-Type |
            |--------|-------------|
            | json | application/json |
            | csv | text/csv（UTF-8 BOM） |
            | sqlite | application/octet-stream |
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  /export/json:
    get:
      tags: [Export]
      summary: Notes エクスポート（JSON）
      description: |
        ファイル名: debug-notes-{env}-YYYYMMDD.json
      parameters:
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt:
                    type: string
                    example: '2026-02-13T10:00:00+09:00'
                  env:
                    type: string
                  version:
                    type: string
                  notes:
                    type: array
                    items:
                      type: object
                  testCases:
                    type: array
                    items:
                      type: object
                  testRuns:
                    type: array
                    items:
                      type: object

  /export/sqlite:
    get:
      tags: [Export]
      summary: Notes エクスポート（SQLite）
      description: |
        ファイル名: debug-notes-{env}-YYYYMMDD.sqlite
      parameters:
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: SQLite DB ファイル
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ── リリースノート（@TWUWB-003）──
  # 公開の名前空間 /release-notes/{p|feed|media}/ だけが認証不要。
  # それ以外は X-Admin-Key または Firebase IDトークンが要る。

  /release-notes:
    get:
      tags: [ReleaseNotes]
      summary: リリースノート一覧（管理）
      description: |
        下書きを含む全件を、項目・メディア込みで返す。
        投入側（feedback-fix）はこれを叩いて `items[].feedback_id` を突き合わせ、
        同じ報告を二重に告知しないようにする。
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReleaseNote'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ReleaseNotes]
      summary: 号を作成（管理）
      description: |
        `previous_release_id` を省略すると、`released_on` から直前の号が自動で選ばれる。
        これが画面の「前回（○月○日 第N号）からの変更」の根拠になる。
        既定は `status=draft` / `is_public=false`（明示しない限り外に出さない）。
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, title, released_on]
              properties:
                version: { type: string, example: 第3号 }
                title: { type: string }
                summary: { type: string, nullable: true }
                released_on: { type: string, format: date, example: '2026-07-29' }
                previous_release_id: { type: integer, nullable: true }
                status: { type: string, enum: [draft, published] }
                is_public: { type: boolean }
      responses:
        '201':
          description: 作成
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ReleaseNoteSummary' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /release-notes/{id}:
    patch:
      tags: [ReleaseNotes]
      summary: 号を更新（管理）
      description: |
        `status`（draft ⇔ published）と `is_public`（社外公開の可否）は別の軸。
        アプリ内にだけ出す社内向けの号は `status=published` かつ `is_public=false` にする。
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string }
                title: { type: string }
                summary: { type: string, nullable: true }
                released_on: { type: string, format: date }
                previous_release_id: { type: integer, nullable: true }
                cover_image_id: { type: integer, nullable: true }
                status: { type: string, enum: [draft, published] }
                is_public: { type: boolean }
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ReleaseNotes]
      summary: 号を削除（管理）
      description: |
        号は論理削除だが、**添付メディアは行もファイル実体も物理削除する**。
        論理削除だけにすると動画の実体が孤児として残るため。
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /release-notes/{id}/items:
    post:
      tags: [ReleaseNotes]
      summary: 項目を追加（管理）
      description: |
        1項目は「これまで(before_text) → これから(after_text)」の対で書く。
        `feedback_id` を入れておくと、投入側が二重掲載を検出できる。
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [headline]
              properties:
                category: { type: string, enum: [fix, improve, feature], default: fix }
                headline: { type: string, example: 編集ボタンで画面が真っ白になるのを直しました }
                where_text: { type: string, nullable: true, example: 案件 > MTGログ }
                before_text: { type: string, nullable: true }
                after_text: { type: string, nullable: true }
                feedback_id: { type: integer, nullable: true }
                sort_order: { type: integer }
      responses:
        '201':
          description: 作成
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ReleaseNoteItem' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /release-notes/{id}/items/{itemId}:
    patch:
      tags: [ReleaseNotes]
      summary: 項目を更新（管理）
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { type: string, enum: [fix, improve, feature] }
                headline: { type: string }
                where_text: { type: string, nullable: true }
                before_text: { type: string, nullable: true }
                after_text: { type: string, nullable: true }
                feedback_id: { type: integer, nullable: true }
                sort_order: { type: integer }
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ReleaseNotes]
      summary: 項目を削除（管理・ぶら下がるメディアも実体ごと消える）
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /release-notes/{id}/images:
    post:
      tags: [ReleaseNotes]
      summary: 画像・動画を添付（管理）
      description: |
        `item_id` を付ければその項目の証跡、省けば号全体の代表メディア（一覧カードに出る）。

        - 上限は既定 50MB（`config.php` の `release_notes_max_upload`）。
          PHP の `upload_max_filesize` / `post_max_size` も同等以上にしておくこと。
        - 許可形式: png / jpeg / webp / gif / mp4 / webm / quicktime。**SVG は不可**。
        - Content-Type は必ず付ける。`application/octet-stream` で飛ぶと拡張子からの
          フォールバックに頼ることになる。
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                item_id: { type: integer }
                caption: { type: string }
      responses:
        '201':
          description: 作成
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ReleaseNoteMedia' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /release-notes/{id}/images/{imageId}:
    delete:
      tags: [ReleaseNotes]
      summary: メディアを削除（管理・実体も消える）
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: imageId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /release-notes/tokens:
    get:
      tags: [ReleaseNotes]
      summary: 公開 URL とトークンを取得（管理）
      description: |
        2種類のトークンを返す（未生成なら生成される）。

        | scope | 見えるもの | 用途 |
        |-------|-----------|------|
        | public | published かつ is_public | クライアントに配る URL |
        | internal | published 全件（社内向けを含む） | アプリ内コンポーネントに渡す feedUrl |
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      public: { $ref: '#/components/schemas/ReleaseNoteTokenInfo' }
                      internal: { $ref: '#/components/schemas/ReleaseNoteTokenInfo' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /release-notes/tokens/rotate:
    post:
      tags: [ReleaseNotes]
      summary: トークンを再発行（管理）
      description: URL が漏れたときの失効手段。**それまでに配った URL は開けなくなる**。
      security:
        - AdminKey: []
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/env'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [public, internal] }
      responses:
        '200':
          description: 再発行後のトークン一式
        '400':
          $ref: '#/components/responses/BadRequest'

  /release-notes/feed/{token}:
    get:
      tags: [ReleaseNotes]
      summary: リリースノート一覧（公開・認証不要）
      description: |
        トークンのスコープで絞った一覧を返す。アプリ内の `<ReleaseNotes />` が読む口。
        トークンが不正なら 404（401 は返さない）。
      parameters:
        - $ref: '#/components/parameters/env'
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  scope: { type: string, enum: [public, internal] }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReleaseNote'
        '404':
          $ref: '#/components/responses/NotFound'

  /release-notes/p/{token}:
    get:
      tags: [ReleaseNotes]
      summary: クライアント向け公開ページ（HTML・認証不要）
      description: |
        自己完結した HTML を返す（外部 CSS/JS/フォントを一切参照しない）。
        ホストアプリのビルド・ルーティング・認証ガードに依存しないので、URL を送るだけで読める。
        `X-Robots-Tag: noindex, nofollow` を付けて検索エンジンには載せない。
      parameters:
        - $ref: '#/components/parameters/env'
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML
          content:
            text/html:
              schema: { type: string }
        '404':
          description: 不正なトークン（HTML のエラーページ）

  /release-notes/media/{token}:
    get:
      tags: [ReleaseNotes]
      summary: 画像・動画の配信（認証不要・Range 対応）
      description: |
        **認証を通さない**。`<img>` / `<video>` は Authorization ヘッダを送れないため、
        認証必須にするとブラウザからは 401 で何も表示されない（curl では通るので気づけない）。
        代わりに推測不能なトークン（24byte hex）を URL に持たせている。

        動画のために Range(206) に対応する。未対応だとブラウザが全部落とし終えるまで
        再生を始められず、シークもできない。
      parameters:
        - $ref: '#/components/parameters/env'
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: Range
          in: header
          required: false
          schema: { type: string, example: bytes=0-1023 }
      responses:
        '200':
          description: 全体
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 部分（Range 指定時）
          headers:
            Content-Range:
              schema: { type: string, example: bytes 0-1023/17059 }
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: 範囲が不正
          headers:
            Content-Range:
              schema: { type: string, example: bytes */17059 }

  /openapi.yaml:
    get:
      tags: [OpenAPI]
      summary: OpenAPI 仕様書取得
      description: この仕様書自体を YAML 形式で返す。認証不要。
      responses:
        '200':
          description: OK
          content:
            application/yaml:
              schema:
                type: string

components:
  schemas:
    Note:
      type: object
      properties:
        id:
          type: integer
        route:
          type: string
          nullable: true
        screen_name:
          type: string
          nullable: true
        title:
          type: string
        content:
          type: string
          maxLength: 4000
        severity:
          type: string
          nullable: true
          enum: [critical, high, medium, low, null]
        status:
          type: string
          enum: [open, in_progress, resolved, rejected, fixed]
        source:
          type: string
          enum: [manual, test]
        created_at:
          type: string
        deleted_at:
          type: string
          nullable: true
        attachment_count:
          type: integer
        latest_comment:
          type: string
          nullable: true
        test_case_ids:
          type: array
          items:
            type: integer

    NoteDetail:
      type: object
      properties:
        id:
          type: integer
        route:
          type: string
          nullable: true
        screen_name:
          type: string
          nullable: true
        title:
          type: string
        content:
          type: string
        user_log:
          type: string
          nullable: true
          maxLength: 20000
        steps:
          type: array
          nullable: true
          items:
            type: string
          description: JSON、最大 500KB
        severity:
          type: string
          nullable: true
          enum: [critical, high, medium, low, null]
        status:
          type: string
          enum: [open, in_progress, resolved, rejected, fixed]
        source:
          type: string
          enum: [manual, test]
        test_case_id:
          type: integer
          nullable: true
          deprecated: true
        test_case_ids:
          type: array
          items:
            type: integer
        console_log:
          type: array
          nullable: true
          items:
            type: object
          description: JSON、最大 500KB
        network_log:
          type: array
          nullable: true
          items:
            type: object
          description: JSON、最大 500KB
        environment:
          type: object
          nullable: true
          description: JSON、最大 500KB
        deleted_at:
          type: string
          nullable: true
        created_at:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'

    NoteCreateRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 4000
        title:
          type: string
          description: 省略時は content 先頭行から自動生成（80 文字）
          maxLength: 80
        route:
          type: string
        screenName:
          type: string
        severity:
          type: string
          nullable: true
          enum: [critical, high, medium, low, null]
        userLog:
          type: string
          maxLength: 20000
        steps:
          type: array
          items:
            type: string
          description: JSON、最大 500KB
        consoleLogs:
          type: array
          items:
            type: object
          description: JSON、最大 500KB
        networkLogs:
          type: array
          items:
            type: object
          description: JSON、最大 500KB
        environment:
          type: object
          description: JSON、最大 500KB
        source:
          type: string
          enum: [manual, test]
          default: manual
        testCaseIds:
          type: array
          items:
            type: integer

    Activity:
      type: object
      properties:
        id:
          type: integer
        note_id:
          type: integer
        action:
          type: string
          enum: [status_change, comment]
        content:
          type: string
          nullable: true
          maxLength: 2000
        old_status:
          type: string
          nullable: true
        new_status:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
          maxLength: 100
        created_at:
          type: string

    Attachment:
      type: object
      description: |
        ファイル名形式: ランダム hex 32 文字 + 拡張子。
        MIME 判定: finfo（拡張子ではなくバイナリ解析）。
        最大サイズ: 5MB。
        許可 MIME: image/png, image/jpeg, image/webp, image/gif。
      properties:
        id:
          type: integer
        filename:
          type: string
        original_name:
          type: string
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif]
        size:
          type: integer
          maximum: 5242880
        created_at:
          type: string

    TestCase:
      type: object
      properties:
        id:
          type: integer
        domain:
          type: string
          maxLength: 200
        capability:
          type: string
          maxLength: 200
        title:
          type: string
          maxLength: 500
        created_at:
          type: string

    TestTree:
      type: object
      properties:
        domain:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityResult'

    CapabilityResult:
      type: object
      properties:
        capability:
          type: string
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        status:
          type: string
          nullable: true
          enum: [fail, retest, passed, null]
          description: |
            fail: fail あり + open ノートあり
            retest: fail あり + open ノートなし
            passed: 全 pass（1件以上）
            null: テスト未実行
        openIssues:
          type: integer
        cases:
          type: array
          items:
            type: object
            properties:
              caseId:
                type: integer
              title:
                type: string
              last:
                type: string
                nullable: true
                enum: [pass, fail, skip, null]
              openIssues:
                type: integer

    TestRunRequest:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            type: object
            required: [caseId, result]
            properties:
              caseId:
                type: integer
              result:
                type: string
                enum: [pass, fail, skip]
              note:
                type: object
                description: fail 時の個別ノート（任意）
                properties:
                  content:
                    type: string
                    maxLength: 4000
                  severity:
                    type: string
                    nullable: true
                    enum: [critical, high, medium, low, null]
                  consoleLogs:
                    type: array
                    items:
                      type: object
                  networkLogs:
                    type: array
                    items:
                      type: object
                  environment:
                    type: object
        failNote:
          type: object
          description: fail 全体の共通ノート（note 未指定の fail ケースに適用）
          properties:
            content:
              type: string
              maxLength: 4000
            severity:
              type: string
              nullable: true
              enum: [critical, high, medium, low, null]

    Feedback:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [bug, question, request, share, other]
        target:
          type: string
          nullable: true
          enum: [app, manual, null]
        customTag:
          type: string
          nullable: true
          maxLength: 50
        message:
          type: string
          maxLength: 4000
        status:
          type: string
          enum: [open, in_progress, closed]
        createdAt:
          type: string
        updatedAt:
          type: string
        attachmentCount:
          type: integer

    FeedbackDetail:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [bug, question, request, share, other]
        target:
          type: string
          nullable: true
          enum: [app, manual, null]
        customTag:
          type: string
          nullable: true
        message:
          type: string
        status:
          type: string
          enum: [open, in_progress, closed]
        pageUrl:
          type: string
          nullable: true
          maxLength: 2000
        userType:
          type: string
          nullable: true
          maxLength: 100
        appVersion:
          type: string
          nullable: true
          maxLength: 50
        environment:
          type: object
          nullable: true
        consoleLogs:
          type: array
          nullable: true
          items:
            type: object
          description: 最大 15 件、JSON 最大 512KB
        networkLogs:
          type: array
          nullable: true
          items:
            type: object
          description: 最大 15 件、JSON 最大 512KB
        createdAt:
          type: string
        updatedAt:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'

    FeedbackCreateRequest:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          enum: [bug, question, request, share, other]
        target:
          type: string
          nullable: true
          enum: [app, manual, null]
        message:
          type: string
          maxLength: 4000
        customTag:
          type: string
          maxLength: 50
        pageUrl:
          type: string
          maxLength: 2000
          pattern: '^https?://'
        userType:
          type: string
          maxLength: 100
        appVersion:
          type: string
          maxLength: 50
        consoleLogs:
          type: array
          items:
            type: object
          maxItems: 15
          description: JSON 最大 512KB
        networkLogs:
          type: array
          items:
            type: object
          maxItems: 15
          description: JSON 最大 512KB
        environment:
          type: object

    ReleaseNoteSummary:
      type: object
      description: 号そのもの（項目・メディアを含まない形）
      properties:
        id: { type: integer }
        version: { type: string, example: 第3号 }
        title: { type: string }
        summary: { type: string, nullable: true, description: 一覧カードに出る1〜2文 }
        released_on: { type: string, format: date }
        previous_release_id: { type: integer, nullable: true }
        cover_image_id: { type: integer, nullable: true }
        status: { type: string, enum: [draft, published] }
        is_public:
          type: boolean
          description: true で公開 URL にも出る。false なら published でもアプリ内だけ
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReleaseNote:
      allOf:
        - $ref: '#/components/schemas/ReleaseNoteSummary'
        - type: object
          properties:
            previous:
              type: object
              nullable: true
              description: 「前回（○月○日 第N号）からの変更」を出すための最小情報
              properties:
                id: { type: integer }
                version: { type: string }
                released_on: { type: string, format: date }
            items:
              type: array
              items:
                $ref: '#/components/schemas/ReleaseNoteItem'
            images:
              type: array
              items:
                $ref: '#/components/schemas/ReleaseNoteMedia'

    ReleaseNoteItem:
      type: object
      description: 1つの変更点。必ず「これまで → これから」の対で読ませる
      properties:
        id: { type: integer }
        release_note_id: { type: integer }
        sort_order: { type: integer }
        category:
          type: string
          enum: [fix, improve, feature]
          description: fix=直したこと / improve=使いやすくしたこと / feature=新しくできること
        headline: { type: string, example: 編集ボタンで画面が真っ白になるのを直しました }
        where_text: { type: string, nullable: true, example: 案件 > MTGログ }
        before_text: { type: string, nullable: true, description: これまでの困りごと }
        after_text: { type: string, nullable: true, description: これからどうなるか }
        feedback_id:
          type: integer
          nullable: true
          description: 元になった報告。投入側が二重掲載を検出する正本

    ReleaseNoteMedia:
      type: object
      description: |
        添付メディア。動作の変化は動画、見た目の変化は静止画で示す。
        token は返さず、配信 URL に埋めた形でのみ渡す。
      properties:
        id: { type: integer }
        release_note_id: { type: integer }
        item_id:
          type: integer
          nullable: true
          description: null なら号全体の代表メディア
        original_name: { type: string }
        mime_type: { type: string, example: video/mp4 }
        size: { type: integer }
        caption: { type: string, nullable: true }
        sort_order: { type: integer }
        url:
          type: string
          description: 認証不要で参照できる配信 URL（<img> / <video> にそのまま入れる）
          example: /__debug/api/release-notes/media/9f2c…

    ReleaseNoteTokenInfo:
      type: object
      properties:
        token: { type: string, description: 24byte hex }
        pageUrl: { type: string, description: クライアントに送る HTML ページの URL }
        feedUrl: { type: string, description: アプリ内コンポーネントが読む JSON の URL }

    Error:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

  securitySchemes:
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Firebase ID トークン。config の firebase_project_id 設定時、notes/feedback 管理は
        AdminKey か FirebaseBearer のどちらかで許可される（OR 受理・v1.2.16+）。

  parameters:
    env:
      name: env
      in: query
      required: true
      schema:
        type: string
        enum: [dev, test]
    noteId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    feedbackId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    attachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer

  responses:
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum: [true]
    BadRequest:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 認証失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Unauthorized
    NotFound:
      description: リソース不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Not found
    TooManyRequests:
      description: レート制限（10 req / 60 sec / IP）
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Too many requests
