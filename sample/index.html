<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dev-tools - Sample</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* copyHostStylesheetsIntoPip() の動作確認用デモ。
       * toho_matching (frontend/src/index.css) の該当ブロックをそのまま複製したもの
       * (手動での部分コピーは漏れが起きやすいため、丸ごとコピーして常に本家と一致させる)。
       * PiP 側にしか存在しないこの CSS が正しくコピーされることを、実際の
       * docs/client/manuals (sample/public/manuals/ に複製済み) で目視確認できるようにする。
       * 元: toho_matching frontend/src/index.css (TOHOMA-338) */
      .manual-shot {
        position: relative;
        line-height: 0;
        margin: 14px 0 18px;
        border: 1px solid #d8dce3;
        background: #f7f8fa;
      }
      .manual-shot img {
        display: block;
        width: 100%;
        height: auto;
      }
      .manual-mark {
        position: absolute;
        border: 2.5px solid #d0300b;
        background: rgba(208, 48, 11, 0.1);
        pointer-events: none;
      }
      .manual-step {
        position: relative;
        margin: 24px 0 24px 40px;
        padding: 14px 16px;
        background: #f6f7fa;
        border: 1px solid #e5e8ee;
        border-radius: 12px;
        box-shadow: 0 6px 16px -12px rgba(4, 62, 128, 0.25);
      }
      .manual-step::before {
        content: '';
        position: absolute;
        left: -25px;
        top: 16px;
        bottom: -24px;
        width: 2px;
        background: #043e80;
      }
      .manual-step:not(:has(+ .manual-step))::before {
        bottom: 16px;
      }
      .manual-step .manual-step-num .n {
        position: absolute;
        left: -40px;
        top: 0;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: #043e80;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        font-size: 13px;
        font-weight: 700;
        box-shadow: 0 0 0 4px #fff;
      }
      .manual-step .manual-step-cap {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.5;
      }
      .manual-step .manual-step-detail {
        font-size: 13.5px;
        color: #6b7280;
        line-height: 1.8;
        margin: 6px 0 0;
      }
      .manual-step .manual-shot {
        margin: 12px 0 0;
      }
      .manual-warn {
        border-left: 3px solid #b03a2e;
        background: #f7eae7;
        padding: 11px 15px;
        font-size: 13.5px;
        line-height: 1.8;
        margin: 10px 0;
      }
      .manual-fyi {
        border-left: 3px solid #043e80;
        background: #e7eff7;
        padding: 11px 15px;
        font-size: 13.5px;
        line-height: 1.8;
        margin: 10px 0;
      }
      .manual-more {
        margin-top: 20px;
        border: 1px solid #e7dfc8;
        background: #fbf8f0;
      }
      .manual-more > summary {
        cursor: pointer;
        list-style: none;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #6b5d2e;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .manual-more > summary::-webkit-details-marker { display: none; }
      .manual-more > summary::before {
        content: '+';
        width: 16px;
        height: 16px;
        border: 1.5px solid #6b5d2e;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        flex: none;
      }
      .manual-more[open] > summary::before { content: '\2212'; }
      .manual-more .manual-more-body {
        padding: 4px 18px 16px 42px;
        border-top: 1px solid #e7dfc8;
      }
      .manual-more .manual-more-body p:first-child { margin-top: 14px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
